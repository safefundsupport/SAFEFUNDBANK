<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAFEFUND BANK — Crypto Banking</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000;
  --bg-2:#0a0a0a;
  --bg-3:#111111;
  --card:#0d0d0d;
  --border:#1e1e1e;
  --border-2:#2a2a2a;
  --text:#ffffff;
  --muted:#8a8a8a;
  --accent:#00ffb2;
  --accent-2:#00a3ff;
  --danger:#ff4d5e;
  --warn:#ffb800;
  --success:#00ffb2;
  --radius:14px;
  --shadow:0 20px 60px rgba(0,255,178,.08);
  --font:'Space Grotesk',sans-serif;
  --display:'Orbitron',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.6;overflow-x:hidden;}
h1,h2,h3,h4,h5{font-family:var(--display);font-weight:700;letter-spacing:.5px;}
a{color:inherit;text-decoration:none;}
button{font-family:var(--font);cursor:pointer;border:none;outline:none;}
input,select,textarea{font-family:var(--font);outline:none;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:var(--bg-2);}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}
.container{max-width:1280px;margin:0 auto;padding:0 22px;}
.hidden{display:none !important;}
.accent{color:var(--accent);}

/* ===== BUTTONS ===== */
.btn{padding:13px 26px;border-radius:10px;font-weight:600;font-size:.9rem;transition:.25s;display:inline-flex;align-items:center;gap:8px;justify-content:center;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#000;font-weight:700;}
.btn-primary:hover{box-shadow:0 0 30px rgba(0,255,178,.45);transform:translateY(-2px);}
.btn-ghost{background:transparent;border:1px solid var(--border-2);color:#fff;}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:8px 16px;font-size:.8rem;}

/* ===== NAV ===== */
.main-nav{
  position:fixed;top:0;left:0;width:100%;z-index:900;
  background:rgba(0,0,0,.8);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);
}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:15px 22px;max-width:1280px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--display);font-size:1.15rem;font-weight:900;letter-spacing:1px;}
.brand-badge{
  width
